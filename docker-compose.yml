services:
  # ============================================
  # 1. Reverse Proxy Gateway (Nginx)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: norofarm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_uploads:/app/uploads:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - norofarm_network

  # ============================================
  # 2. Frontend Web (Next.js 15 Standalone)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    container_name: norofarm_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - norofarm_network

  # ============================================
  # 3. Backend API (FastAPI Python 3.13)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: norofarm_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - norofarm_network

  # ============================================
  # 4. In-Memory Cache & Rate Limiting (Redis)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: norofarm_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - norofarm_network

volumes:
  backend_uploads:
    name: norofarm_backend_uploads
  redis_data:
    name: norofarm_redis_data
  certbot_etc:
    name: norofarm_certbot_etc
  certbot_var:
    name: norofarm_certbot_var

networks:
  norofarm_network:
    name: norofarm_network
    driver: bridge
