[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "alembic",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
]
ignore = [
    "E501",  # Line too long
    "F401",  # Unused imports
    "E712",  # Avoid equality comparisons to True (common in SQLAlchemy filter queries)
    "E402",  # Module level import not at top of file
    "I001",  # Unsorted import blocks
    "W",     # Whitespace warnings
]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
disable_error_code = ["attr-defined", "valid-type", "import-untyped", "misc", "assignment", "no-redef", "arg-type"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
