<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>

    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#fde047" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Hexagonal Rounded Badge Frame -->
  <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#bgGrad)" stroke="#10b981" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Subtle Circuit Grid Pattern in Background -->
  <g stroke="#10b981" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3">
    <circle cx="100" cy="100" r="72" fill="none"/>
    <circle cx="100" cy="100" r="48" fill="none"/>
    <line x1="28" y1="100" x2="172" y2="100"/>
    <line x1="100" y1="28" x2="100" y2="172"/>
  </g>

  <!-- Neural AI Constellation Lines -->
  <g stroke="url(#aiGrad)" stroke-width="1.8" opacity="0.8">
    <line x1="65" y1="65" x2="100" y2="85"/>
    <line x1="135" y1="65" x2="100" y2="85"/>
    <line x1="100" y1="85" x2="100" y2="135"/>
    <line x1="60" y1="120" x2="80" y2="110"/>
    <line x1="140" y1="120" x2="120" y2="110"/>
  </g>

  <!-- Neural Nodes (Sparkles) -->
  <circle cx="65" cy="65" r="4.5" fill="#fde047" filter="url(#sparkleGlow)"/>
  <circle cx="135" cy="65" r="4.5" fill="#fde047" filter="url(#sparkleGlow)"/>
  <circle cx="60" cy="120" r="3.5" fill="#34d399"/>
  <circle cx="140" cy="120" r="3.5" fill="#34d399"/>

  <!-- Stylized Agricultural Sprout Leaves with Glow -->
  <g filter="url(#aiGlow)">
    <!-- Left Leaf -->
    <path d="M 100 135 C 75 130 55 105 65 75 C 80 80 95 95 100 115 Z" fill="url(#leafGrad)"/>
    <!-- Right Leaf -->
    <path d="M 100 135 C 125 130 145 105 135 75 C 120 80 105 95 100 115 Z" fill="url(#leafGrad)"/>
    <!-- Central Sprout Stem & Core -->
    <path d="M 98 142 L 102 142 L 101 88 L 99 88 Z" fill="#ffffff"/>
  </g>

  <!-- Golden Central AI Sparkle Star -->
  <g transform="translate(100, 72)" filter="url(#sparkleGlow)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="url(#aiGrad)"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Small AI Badge at Bottom -->
  <g transform="translate(100, 162)">
    <rect x="-24" y="-10" width="48" height="18" rx="7" fill="#0f172a" stroke="url(#aiGrad)" stroke-width="1.5"/>
    <text x="0" y="3" fill="#fde047" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.5">AI</text>
  </g>
</svg>
